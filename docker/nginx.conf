server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # Built JS/CSS files have a content hash in their name: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # Single-page app: every other URL (e.g. /?name=Penang...) serves index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
